[Debug]
bDiagnostics = 1
bNoRenderHooks = 0
bNoViewFixup = 0
bNoWvpFixup = 0
bNoBlockDraw = 0
bNoVtableSelfCheck = 0; NOT a hook isolation: this keeps all eight hooks and turns off only CheckSurfaceVtable /
; CheckTextureVtable, the three calls Present makes right after the "depth stencil" line - the last
; line the crashing run wrote, 203 ms before the fault. surf::GetDesc is slot 8 and GetDescAlt slot 10
; while the published IDirect3DSurface8 table has GetDesc at 6, and slot 8 answering with a sane
; 1920x1080 is not proof: a slot that takes no argument returns a handle SUCCEEDED() reads as success
; and leaves the description untouched. This is the single most likely suspect, so it goes first.
sDisabledHooks =
bNoVtableSelfCheck = 1
